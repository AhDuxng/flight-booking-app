services:
  - type: web
    name: flight-booking-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: true
      - key: BODY_LIMIT
        value: 100kb
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: AUTH_RATE_LIMIT
        value: 20
      - key: PUBLIC_RATE_LIMIT
        value: 100
      - key: FLIGHT_SEARCH_CACHE_TTL_SECONDS
        value: 15
      - key: SEAT_CLEANUP_INTERVAL_MS
        value: 60000
      - key: SCHEDULE_GENERATION_HORIZON_DAYS
        value: 90
      - key: SCHEDULE_GENERATION_INTERVAL_MS
        value: 86400000
      - key: OUTBOX_POLL_INTERVAL_MS
        value: 5000
      - key: REFUND_RECONCILIATION_INTERVAL_MS
        value: 60000
      - key: INVENTORY_RECONCILIATION_INTERVAL_MS
        value: 300000
      - key: INVENTORY_RECONCILIATION_AUTO_REPAIR
        value: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_REQUEST_TIMEOUT_MS
        value: 15000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: FRONTEND_URL
        value: https://vietfly.netlify.app
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: PAYMENT_CHECKOUT_API_URL
        sync: false
      - key: PAYMENT_REFUND_API_URL
        sync: false
      - key: PAYMENT_REFUND_STATUS_API_URL
        sync: false
      - key: PAYMENT_REQUEST_TIMEOUT_MS
        value: 10000
      - key: PAYMENT_WEBHOOK_REPLAY_WINDOW_SECONDS
        value: 300
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_PAY_URL
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - key: VNPAY_API_URL
        value: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
      - key: VNPAY_RETURN_URL
        value: https://flight-booking-app-sjmo.onrender.com/api/payments/vnpay/return
      - key: VNPAY_IPN_URL
        value: https://flight-booking-app-sjmo.onrender.com/api/payments/vnpay/ipn
      - key: PAYMENT_SECRET_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_RETURN_URL
        sync: false
      - key: PAYMENT_CANCEL_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
